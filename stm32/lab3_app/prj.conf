CONFIG_GPIO=y
CONFIG_WATCHDOG=y
# Defer IWDG start to lab3_watchdog_start(); Zephyr otherwise installs a
# 100 ms boot timeout and rejects the application's timeout with -ENOMEM.
CONFIG_WDT_DISABLE_AT_BOOT=y
CONFIG_SPI=y
CONFIG_CAN=y
CONFIG_CAN_MCP2515=y
CONFIG_CAN_INIT_PRIORITY=80
CONFIG_CAN_MAX_FILTER=8
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_HWINFO=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_MINIMAL_LIBC=y
CONFIG_PICOLIBC=n
CONFIG_MAIN_THREAD_PRIORITY=6
