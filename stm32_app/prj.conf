CONFIG_PWM=y
CONFIG_GPIO=y

# Interactive servo testing over the Nucleo ST-LINK virtual serial port.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_GPIO_SHELL=y

# Dual timer quadrature encoders (TIM2/TIM4).
CONFIG_SENSOR=y
CONFIG_QDEC_STM32=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
